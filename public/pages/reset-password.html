
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | CUBEX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .exito {
            color: #15803d;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Restablecer contraseña</h1>

        <p class="description">
            Ingresa tu nueva contraseña para recuperar el acceso
            a tu cuenta CUBEX.
        </p>

        <form id="formulario">

            <label for="password">Nueva contraseña</label>
            <input
                type="password"
                id="password"
                minlength="8"
                required
                placeholder="Mínimo 8 caracteres"
            >

            <label for="confirmar">Confirmar contraseña</label>
            <input
                type="password"
                id="confirmar"
                minlength="8"
                required
                placeholder="Repite tu contraseña"
            >

            <button type="submit" id="btnGuardar">
                Cambiar contraseña
            </button>

        </form>

        <p id="mensaje"></p>

    </main>

    <script src="../js/config.js"></script>
    <script>
        const API = CUBEX_CONFIG.API.RECUPERAR_PASSWORD;
        const parametros = new URLSearchParams(window.location.search);
        const token = parametros.get("token");

        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("btnGuardar");

        function mostrarMensaje(texto, tipo) {
            mensaje.textContent = texto;
            mensaje.className = tipo;
        }

        async function validarToken() {
            if (!token) {
                formulario.style.display = "none";
                mostrarMensaje(
                    "El enlace no contiene un token de recuperación.",
                    "error"
                );
                return;
            }

            try {
                const respuesta = await fetch(
                    `${API}/reset-password/validate-token?token=${encodeURIComponent(token)}`
                );

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.valid) {
                    formulario.style.display = "none";
                    mostrarMensaje(
                        datos.message || "El enlace no es válido o ha expirado.",
                        "error"
                    );
                }

            } catch (error) {
                formulario.style.display = "none";
                mostrarMensaje(
                    "No se pudo conectar con el servidor.",
                    "error"
                );
            }
        }

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const password = document.getElementById("password").value;
            const confirmar = document.getElementById("confirmar").value;

            if (password.length < 8) {
                mostrarMensaje(
                    "La contraseña debe tener al menos 8 caracteres.",
                    "error"
                );
                return;
            }

            if (password !== confirmar) {
                mostrarMensaje(
                    "Las contraseñas no coinciden.",
                    "error"
                );
                return;
            }

            boton.disabled = true;
            boton.textContent = "Actualizando...";

            try {
                const respuesta = await fetch(
                    `${API}/reset-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token,
                            password: password
                        })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarMensaje(
                        datos.message || "No se pudo cambiar la contraseña.",
                        "error"
                    );
                    return;
                }

                formulario.style.display = "none";

                mostrarMensaje(
                    "¡Tu contraseña se actualizó correctamente! Ya puedes iniciar sesión.",
                    "exito"
                );

            } catch (error) {
                mostrarMensaje(
                    "No se pudo conectar con el servidor.",
                    "error"
                );
            } finally {
                boton.disabled = false;
                boton.textContent = "Cambiar contraseña";
            }
        });

        validarToken();
    </script>

</body>
</html>
