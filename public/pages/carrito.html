<div class="carrito-overlay" id="carritoOverlay"></div>

<aside class="panel-carrito" id="panelCarrito">
    <div class="carrito-header">
        <h2>Mi carrito</h2>
        <button id="cerrarCarrito" type="button">&times;</button>
    </div>

    <div class="carrito-contenido" id="carritoContenido">
        <p class="carrito-vacio">Tu carrito está vacío.</p>
    </div>
    <p id="mensajeCarritoPanel" class="mensaje-carrito-panel"
   role="status" aria-live="polite"></p>

    <div class="carrito-footer">
        <div class="carrito-total">
            <span>Total:</span>
            <strong id="totalCarrito">$0.00</strong>
        </div>
        <button id="btnContinuarCompra" type="button">
            Continuar compra
        </button>
    </div>
</aside>
