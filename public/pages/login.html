<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | CUBEX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;

            background:
                radial-gradient(circle at 15% 15%, rgba(0, 112, 210, 0.18), transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(230, 184, 0, 0.08), transparent 30%),
                linear-gradient(135deg, #101827, #142b49 65%, #101827);

            font-family: Arial, Helvetica, sans-serif;
            color: #f5f7fa;
        }

        /* CONTENEDOR */
        .contenedor {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            display: inline-block;
            color: #FFD21F;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 10px;
            text-decoration: none;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(255, 210, 31, 0.12);
        }

        .eslogan {
            color: #bdcce0;
            font-size: 14px;
            letter-spacing: 1px;
            margin: 0 0 35px;
        }

        /* TARJETA PRINCIPAL */
        .tarjeta {
            width: 100%;
            padding: 45px 55px;
            background: rgba(25, 35, 53, 0.97);
            border: 1px solid rgba(148, 170, 200, 0.19);
            border-radius: 20px;
            text-align: left;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
        }

        /* ICONO */
        .icono-login {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: rgba(255, 210, 31, 0.12);
            color: #FFD21F;
            font-size: 30px;
        }

        /* TITULO */
        .tarjeta h1 {
            color: #ffffff;
            font-size: 30px;
            margin: 0 0 10px;
            text-align: center;
        }

        .descripcion {
            color: #aebed2;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            margin: 0 0 35px;
        }

        /* CAMPOS */
        .campo {
            margin-bottom: 24px;
        }

        .campo label {
            display: block;
            color: #e7edf6;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .campo input {
            width: 100%;
            height: 54px;
            padding: 0 17px;
            border: 1px solid #40516a;
            border-radius: 9px;
            outline: none;
            background: #111d30;
            color: #ffffff;
            font-size: 15px;
            transition: 0.25s;
        }

        .campo input::placeholder {
            color: #8292a8;
        }

        .campo input:focus {
            border-color: #FFD21F;
            box-shadow: 0 0 0 3px rgba(255, 210, 31, 0.10);
        }

        /* MENSAJES */
        #mensaje {
            min-height: 18px;
            margin: 0 0 15px;
            color: #ff8585;
            font-size: 13px;
            text-align: center;
        }

        /* BOTON */
        #btnLogin {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 9px;
            background: #FFD21F;
            color: #171717;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        #btnLogin:hover {
            background: #ffe16a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 210, 31, 0.17);
        }

        #btnLogin:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* REGISTRO */
        .registro {
            margin: 28px 0 0;
            color: #b8c5d6;
            font-size: 14px;
            text-align: center;
        }

        .registro a {
            color: #FFD21F;
            font-weight: bold;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        /* VOLVER */
        .volver {
            display: block;
            margin-top: 28px;
            color: #aebed2;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }

        .volver:hover {
            color: #FFD21F;
        }

        /* DECORACION */
        .decoracion {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 25px;
        }

        .decoracion span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FFD21F;
            opacity: 0.65;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .contenedor {
                max-width: 100%;
            }

            .logo {
                font-size: 40px;
            }

            .tarjeta {
                padding: 30px 23px;
            }

            .tarjeta h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <a href="index.html" class="logo">CUBEX</a>

        <p class="eslogan">EL RETO ESTÁ EN TUS MANOS</p>

        <section class="tarjeta">

            <div class="icono-login">
                ♙
            </div>

            <h1>¡Bienvenido de nuevo!</h1>

            <p class="descripcion">
                Inicia sesión para descubrir tus productos
                y continuar con tus compras.
            </p>

            <form id="formulario-login">

                <div class="campo">

                    <label for="nombreUsuario">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="nombreUsuario"
                        name="nombreUsuario"
                        placeholder="Escribe tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p id="mensaje" role="status" aria-live="polite"></p>

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

            </form>

            <p class="registro">
                ¿Aún no tienes una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>

            <a href="index.html" class="volver">
                ← Regresar a la tienda
            </a>

        </section>

        <div class="decoracion">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
