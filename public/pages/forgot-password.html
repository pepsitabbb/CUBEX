
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | CUBEX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
            text-align: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 18px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 18px;
            font-size: 14px;
        }

        .volver {
            display: inline-block;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Recuperar contraseña</h1>

        <p>
            Ingresa el correo electrónico asociado a tu cuenta CUBEX.
            Te enviaremos un enlace para crear una nueva contraseña.
        </p>

        <form id="formRecuperacion">
            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                required
            >

            <button type="submit" id="btnEnviar">
                Enviar enlace
            </button>
        </form>

        <div id="mensaje"></div>

        <a href="login.html" class="volver">
            Volver al inicio de sesión
        </a>
    </div>

    <script src="../js/config.js"></script>
    <script>
        const formulario = document.getElementById("formRecuperacion");
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("btnEnviar");

        formulario.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();

            mensaje.textContent = "";
            boton.disabled = true;
            boton.textContent = "Enviando...";

            try {
                const respuesta = await fetch(
                    CUBEX_CONFIG.API.RECUPERAR_PASSWORD + "/forgot-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        datos.message || "No fue posible procesar la solicitud."
                    );
                }

                mensaje.style.color = "#15803d";
                mensaje.textContent = datos.message;

                formulario.reset();

            } catch (error) {
                mensaje.style.color = "#dc2626";
                mensaje.textContent =
                    error.message || "Error al conectar con el servidor.";
            } finally {
                boton.disabled = false;
                boton.textContent = "Enviar enlace";
            }
        });
    </script>

</body>
</html>
